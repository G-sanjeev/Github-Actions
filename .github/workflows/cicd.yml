name: Hello World
# trigger option (manual trigger)
on: workflow_dispatch
# on a workflow to perform certain operation we use job.
jobs:
  Build:
    # to run this job provide a agent on runner environment.
    runs-on: ubuntu-22.04
    # lines..
    steps:
      # multiple shell commands 
      - name: Build stage
        run: |
          echo " build stage in progress"
          echo " build stage completed "
  Test:
    runs-on: ubuntu-22.04
    # needs to run the job in sequentaily way
    needs: Build
    steps:
      - name: test stage
        run : echo "test stage"
  Deploy:
    runs-on: ubuntu-22.04
    needs: Test
    steps:
      - name: deploy stage
        run: echo "deploy stage "
        
